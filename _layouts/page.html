---
layout: default
---
<section class="section page-shell-section">
  <div class="container page-shell">
    {% if page.title %}
      <div class="page-title-block reveal-up">
        <p class="eyebrow">Profile Section</p>
        <h1 class="page-title">{{ page.title }}</h1>
      </div>
    {% endif %}
    <div class="page-content reveal-up">
      {{ content }}
    </div>
  </div>
</section>
