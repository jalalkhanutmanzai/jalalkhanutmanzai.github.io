<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.seo_title %}{{ page.seo_title | escape }}{% else %}{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}{% endif %}</title>
    <meta name="theme-color" content="#f6f5ef" />
    <meta name="google-site-verification" content="KTrb9i2T8Y_zFtLfnOx5roJhLZkMn2_TI3d5c111FVE" />
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml" /><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    {% seo title=false %}
    {% if page.person_profile %}{% include person-schema.html %}{% endif %}
  </head>
  <body>
    <div class="site-aura" aria-hidden="true"></div>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content">{{ content }}</main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
